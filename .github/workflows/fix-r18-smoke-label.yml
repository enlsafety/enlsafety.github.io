name: One-time fix r18 smoke label
on:
  push:
    paths:
      - '.github/workflows/fix-r18-smoke-label.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct smoke label expectation
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/v410-smoke.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'시험 알림'","'테스트 알림'")
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-r18-smoke-label.yml').unlink()
      - name: Commit safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix r18 PWA smoke label'
          git pull --rebase origin main
          git push
