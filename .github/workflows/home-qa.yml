name: Verify illustrated home shortcuts
on:
  push:
    branches: [qa/home-artwork-r148]
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 jsdom@26
      - run: node tests/final-cache.cjs && node tests/sidebar-dom.cjs
      - run: PW_CHANNEL=chrome node tests/newsroom-browser.cjs
