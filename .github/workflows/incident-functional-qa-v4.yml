name: incident functional QA v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/incident-functional-qa-v4.yml'
      - 'qa-functional-v3.mjs'
      - 'qa-functional-v4-wrapper.mjs'
      - 'stable412.html'
      - 'v3-actions.js'
      - 'incident-sync-v411.js'
      - 'workflow-lifecycle-v413.js'
      - 'sync-conflict-v428.js'
  workflow_dispatch:

concurrency:
  group: incident-functional-qa-v4
  cancel-in-progress: false

jobs:
  functional-qa-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Run corrected functional QA
        timeout-minutes: 8
        run: node qa-functional-v4-wrapper.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-functional-qa-v4
          path: qa-functional-v3
          if-no-files-found: warn
      - name: Fail workflow on QA failures
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='qa-functional-v3/result.json';
          if(!fs.existsSync(p)){console.error('QA result.json missing');process.exit(1)}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const fail=Number(r?.summary?.fail||0);
          const p1=Number(r?.summary?.p1||0);
          console.log(`QA summary: PASS=${r?.summary?.pass||0} FAIL=${fail} P1=${p1} UNTESTED=${r?.summary?.untested||0}`);
          if(fail>0||p1>0)process.exit(1);
          NODE
