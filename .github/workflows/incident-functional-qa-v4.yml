name: incident functional QA v4

on:
  workflow_dispatch:
    inputs:
      confirm_production_test:
        description: '운영 DB에 TEST 데이터가 생성될 수 있습니다. 실행하려면 RUN을 입력하세요.'
        required: true
        default: ''

concurrency:
  group: incident-functional-qa-v5
  cancel-in-progress: false

jobs:
  functional-qa-v4:
    if: ${{ github.event.inputs.confirm_production_test == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Warn about production test data
        run: |
          echo 'This workflow intentionally exercises the production backend.'
          echo 'It is manual-only to prevent deployment commits from creating TEST records in production.'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Run corrected functional QA
        timeout-minutes: 8
        run: node qa-functional-v4-wrapper.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-functional-qa-v4
          path: qa-functional-v3
          if-no-files-found: warn
      - name: Fail workflow on QA failures
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='qa-functional-v3/result.json';
          if(!fs.existsSync(p)){console.error('QA result.json missing');process.exit(1)}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const fail=Number(r?.summary?.fail||0);
          const p1=Number(r?.summary?.p1||0);
          console.log(`QA summary: PASS=${r?.summary?.pass||0} FAIL=${fail} P1=${p1} UNTESTED=${r?.summary?.untested||0}`);
          if(fail>0||p1>0)process.exit(1);
          NODE
# release-gate: v5-queue-reset-corrective-convergence-20260909
