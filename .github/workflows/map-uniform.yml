name: Map risk level interaction
on:
  push:
    branches: [qa/map-uniform-r156]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [map-marker-labels,dashboard-browser]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.51.1-noble
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: node tests/${{ matrix.suite }}.cjs
