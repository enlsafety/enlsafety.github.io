name: mobile session smoke

on:
  workflow_dispatch:

jobs:
  mobile-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check session-refresh-v412.js
          node --check app-control-v410.js
          node tests/session-proof-reuse.cjs
      - name: Tablet background, update, authentication and logout behavior
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium webkit
          node tests/tablet-session-browser.cjs
