name: production smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'stable412.html'
      - 'auth-v411.js'
      - 'login-layout-v412.js'
      - 'incident-sync-v411.js'
      - 'workflow-lifecycle-v413.js'
      - 'workflow-prevention-v429.js'
      - 'incident-review-v431.js'
      - 'production-cleanup-v431.js'
      - 'workflow-enhancements-v432.js'
      - 'site-admin-hotfix-v433.js'
      - 'personnel-management-v434.js'
      - 'legal-review-v435.js'
      - 'industrial-report-v436.js'
      - 'closed-incident-reopen-v438.js'
      - 'official-records-v439.js'
      - 'responsive-v432.css'
      - 'incident-excel-v421.js'
      - 'pwa-push-v418.js'
      - 'push-session-v425.js'
      - 'hq-notification-status-v437.js'
      - 'sw-v418.js'
      - 'manifest.webmanifest'
      - '.github/workflows/v410-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'stable412.html'
      - 'auth-v411.js'
      - 'login-layout-v412.js'
      - 'incident-sync-v411.js'
      - 'workflow-lifecycle-v413.js'
      - 'workflow-prevention-v429.js'
      - 'incident-review-v431.js'
      - 'production-cleanup-v431.js'
      - 'workflow-enhancements-v432.js'
      - 'site-admin-hotfix-v433.js'
      - 'personnel-management-v434.js'
      - 'legal-review-v435.js'
      - 'industrial-report-v436.js'
      - 'closed-incident-reopen-v438.js'
      - 'official-records-v439.js'
      - 'responsive-v432.css'
      - 'incident-excel-v421.js'
      - 'pwa-push-v418.js'
      - 'push-session-v425.js'
      - 'hq-notification-status-v437.js'
      - 'sw-v418.js'
      - 'manifest.webmanifest'
      - '.github/workflows/v410-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          for f in core.js auth-v411.js login-layout-v412.js incident-sync-v411.js workflow-lifecycle-v413.js workflow-prevention-v429.js incident-review-v431.js production-cleanup-v431.js workflow-enhancements-v432.js site-admin-hotfix-v433.js personnel-management-v434.js legal-review-v435.js industrial-report-v436.js closed-incident-reopen-v438.js official-records-v439.js incident-excel-v421.js pwa-push-v418.js push-session-v425.js hq-notification-status-v437.js sw-v418.js; do
            node --check "$f"
          done

      - name: Production runtime wiring
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json

          meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert meta.get('build')=='stable-425-r1',meta
          assert meta.get('stableEntry')=='stable412.html',meta
          assert meta.get('version')=='4.2.5' and meta.get('currentStableVersion')=='4.2.5',meta

          index=Path('index.html').read_text(encoding='utf-8')
          for x in ["const BUILD='425-r1'",'beforeinstallprompt','stable412.html?entry=root&build=425-r1',"/sw-v418.js?v=4.2.5-pwa4-confirm1"]: assert x in index,x

          html=Path('stable412.html').read_text(encoding='utf-8')
          required=[
            'enl-build" content="4.2.5-r1',
            'incident-sync-v411.js?v=4.2.1-r1&amp;fix=official-auth-reprompt1',
            'workflow-prevention-v429.js?v=4.1.2-r30&amp;fix=prevention-flow2',
            'incident-review-v431.js?v=4.1.2-r31&amp;fix=review-preview1',
            'production-cleanup-v431.js?v=4.1.2-r34&amp;fix=legacy-demo2',
            'workflow-enhancements-v432.js?v=4.1.2-r32&amp;fix=workflow-ux1',
            'site-admin-hotfix-v433.js?v=4.1.2-r33&amp;fix=site-api1',
            'personnel-management-v434.js?v=4.1.4-r1&amp;fix=personnel-integrity2',
            'legal-review-v435.js?v=4.1.2-r35&amp;fix=legal-simplify1',
            'industrial-report-v436.js?v=4.1.2-r36&amp;fix=moel-form30-1',
            'closed-incident-reopen-v438.js?v=4.3.8&amp;fix=closed-reopen1',
            'official-records-v439.js?v=4.3.9&amp;fix=official-records1',
          ]
          for x in required: assert x in html,x
          assert 'auth-v411.js?v=4.2.5-r1&amp;fix=password-focus1' in html
          assert 'login-layout-v412.js?v=4.2.5-r1&amp;fix=guide-removed1' in html
          auth=Path('auth-v411.js').read_text(encoding='utf-8')
          for x in ["const duplicateSiteName=siteIds.length>1;",'login411-aff-duplicate','동명이인이 있습니다. 본인 사업장을 꼭 확인해 선택해 주세요.',"details.dataset.selectedLabel411=label",'login411-aff-selected','details.open=false','소속사업장을 선택해 주세요.','비밀번호를 입력하세요.','autofocus','focusPassword()']: assert x in auth,x
          assert 'login411-guide' not in auth and '로그인 순서' not in auth
          layout=Path('login-layout-v412.js').read_text(encoding='utf-8')
          for x in ["const selectedLabel=details.dataset.selectedLabel411||''","if(selectedLabel)details.open=false",'login411-summary-label']: assert x in layout,x
          assert 'GUIDE_HTML' not in layout and "grid-row:4" in layout
          assert 'hq-notification-status-v437.js?v=4.3.7&amp;fix=hq-notify4' in html
          assert 'pwa-push-v418.js?v=4.1.5-r1&amp;fix=device-readiness2' in html
          assert 'push-session-v425.js?v=4.1.5-r1&amp;fix=device-heartbeat2' in html
          assert 'site-admin-v415.js?v=4.1.4-r1&amp;fix=personnel3' in html
          hq=Path('hq-notification-status-v437.js').read_text(encoding='utf-8')
          sw=Path('sw-v418.js').read_text(encoding='utf-8')
          assert 'data-pm434-hq-edit' in hq and 'data-pm434-hq-pw' in hq
          assert 'PUSH_CONFIRM_API' in sw and "action:'ack_test_token'" in sw and "action:'confirm',title:'확인'" in sw
          assert "status==='confirmed'" in hq and '수신 확인' in hq
          assert html.index('personnel-management-v434.js') < html.index('hq-notification-status-v437.js')

          class R(HTMLParser):
            def __init__(self): super().__init__(); self.refs=[]; self.scripts=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='script' and d.get('src'): self.refs.append(d['src']); self.scripts.append(d['src'])
              if t=='link' and d.get('href'): self.refs.append(d['href'])
          p=R();p.feed(html)
          missing=[]
          for ref in p.refs:
            path=urlsplit(ref).path.lstrip('/')
            if path and not Path(path).exists(): missing.append(path)
          assert not missing,missing
          hotfix='site-admin-hotfix-v433.js?v=4.1.2-r33&fix=site-api1'
          personnel='personnel-management-v434.js?v=4.1.4-r1&fix=personnel-integrity2'
          legal='legal-review-v435.js?v=4.1.2-r35&fix=legal-simplify1'
          industrial='industrial-report-v436.js?v=4.1.2-r36&fix=moel-form30-1'
          assert p.scripts.index(hotfix) < p.scripts.index(personnel) < p.scripts.index(legal) < p.scripts.index(industrial)

          cleanup=Path('production-cleanup-v431.js').read_text(encoding='utf-8')
          assert "const VERSION='4.3.1-cleanup2'" in cleanup
          assert "new Set(['u-field-demo','u-final-demo'])" in cleanup
          assert "u-safety-demo" in cleanup and 'must not be removed' in cleanup

          pm=Path('personnel-management-v434.js').read_text(encoding='utf-8')
          for x in [
            "const VERSION='4.3.4-personnel-integrity1'",
            '/functions/v1/enl-personnel-v434',
            "['personnel_pull','personnel_upsert','personnel_delete']",
            'manager_name_conflict',
            'duplicate_personnel',
            '일반근로자를 등록·수정·퇴사·삭제',
            'registered_count:general+field',
            'window.enlSyncHqUsers=async function',
            "currentView||'')==='more'",
          ]: assert x in pm,x

          legal_js=Path('legal-review-v435.js').read_text(encoding='utf-8')
          for x in [
            "const VERSION='4.3.5-legal-simplify1'",
            '법정 보고 검토 필요',
            "modal.querySelector('.inc411-priority-box')?.remove()",
            "modal.querySelector('#saveNote')?.remove()",
            "legalReviewStatus='reviewed'",
          ]: assert x in legal_js,x

          industrial_js=Path('industrial-report-v436.js').read_text(encoding='utf-8')
          for x in [
            "const VERSION='4.3.6-industrial-report1'",
            '/functions/v1/enl-industrial-report-v436',
            '주민등록번호 앞 7자리',
            '공식서식 PDF 미리보기',
            '수동보완',
            '정정본 만들기',
            "action:'render_pdf'",
          ]: assert x in industrial_js,x

          prevention=Path('workflow-prevention-v429.js').read_text(encoding='utf-8')
          for x in ['사고 접수완료','재발방지계획 등록','실제 실시한 재발방지조치','재발방지조치 확인완료']: assert x in prevention,x
          enhancement=Path('workflow-enhancements-v432.js').read_text(encoding='utf-8')
          for x in ["confirm('수신완료 처리 하시겠습니까?')",'실제 조치 완료일 *','attachments().length<1',"currentView='stats'"]: assert x in enhancement,x
          official=Path('official-records-v439.js').read_text(encoding='utf-8')
          for x in ['PDF 보고서 출력','공식 전자결재 기록','감사로그','backup_restore','delete_incident','공식기록 · 백업/복원']: assert x in official,x
          sync=Path('incident-sync-v411.js').read_text(encoding='utf-8')
          assert 'authProof()' in sync and 'actorPasswordHash' in sync and 'actorPinHash' in sync and 'auth_proof_required' in sync and 'cacheProof' in sync
          reopen=Path('closed-incident-reopen-v438.js').read_text(encoding='utf-8')
          for x in ['closed_rollback_to_report_approved',"i.status='approved'",'i.corrective=null','종결 취소 · 사고승인 단계로','enlEditIncidentInReportForm']: assert x in reopen,x
          lifecycle=Path('workflow-lifecycle-v413.js').read_text(encoding='utf-8')
          assert "String(i.status)==='approved'&&String(i.corrective?.status)==='approved'" in lifecycle
          assert "i.status='closed'" in lifecycle
          print('OK: r36 industrial accident report workflow, stable wiring and existing production controls')

      - name: Excel 2019 finalized workbook smoke
        run: |
          node <<'NODE'
          global.window=global;
          global.currentUser=()=>({role:'safety',name:'테스트 관리자'});
          global.siteById=()=>({name:'테스트 사업장'});
          global.ENL_SITE_DIRECTORY=[];
          global.enlIncidentFinalized=i=>!!i&&i.status==='closed'&&i.corrective?.status==='approved';
          const tiny='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z1gAAAABJRU5ErkJggg==';
          const sample={id:'inc-test',siteId:'s-test',category:'person',eventType:'넘어짐',severity:'moderate',priority:'important',reporterName:'테스트 보고자',occurredAt:'2026-09-01T01:30:00.000Z',status:'closed',immediateAction:'응급처치',photos:[{kind:'image',name:'현장.png',dataUrl:tiny}],reportDetails:{place:'테스트',workAction:'작업 중',incidentHow:'미끄러짐',injuredName:'근로자',injuryDetail:'경미'},corrective:{status:'approved',rootCause:'확인 미흡',planDetail:'사전점검',actionDetail:'표지 설치',ownerName:'담당자',reviewedAt:'2026-09-02T01:00:00.000Z',afterPhotos:[{kind:'image',name:'조치.png',dataUrl:tiny}]}};
          global.data={incidents:[sample]};
          require('./incident-excel-v421.js');
          (async()=>{const bytes=await global.enlBuildFinalIncidentWorkbook(sample);if(!bytes||bytes.length<10000)throw new Error('xlsx output too small');const b=Buffer.from(bytes);if(b[0]!==0x50||b[1]!==0x4b)throw new Error('xlsx zip signature missing');console.log('xlsx bytes',bytes.length)})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Non-invasive live API health
        shell: python
        run: |
          import json,urllib.request,urllib.error
          BASE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(fn,body,timeout=25):
            req=urllib.request.Request(BASE+fn,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
            except urllib.error.HTTPError as e:
              try:p=json.loads(e.read().decode())
              except:p={}
              return e.code,p
          for fn in ['enl-incident-sync-v411','enl-incident-compliance-v439','enl-push-v418','enl-account-v420','enl-push-claim-v425','enl-push-admin-v437','enl-personnel-v434','enl-industrial-report-v436']:
            code,j=call(fn,{'action':'health'})
            assert code==200 and j.get('ok') is True,(fn,code,j)
          code,j=call('enl-incident-compliance-v439',{'action':'backup_list','actor':{'id':'missing','name':'x','role':'safety'},'actorPasswordHash':'invalid'})
          assert code==403 and j.get('message')=='forbidden',(code,j)
          code,j=call('enl-incident-sync-v411',{'action':'pull','actor':{'id':'missing','name':'x','role':'safety'}})
          assert code==403 and j.get('message')=='forbidden',(code,j)
          print('OK: official-record endpoints are live and reject unverified actors without changing data')
