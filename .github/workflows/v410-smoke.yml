name: v410 smoke

on:
  push:
    branches: [main]
    paths:
      - 'auth-core-v410.js'
      - 'app-control-v410.js'
      - 'field-ui-v410.js'
      - 'field-ui-v410.css'
      - 'incidents-v410.js'
      - 'incident-sync-v410.js'
      - 'site-directory-v410.js'
      - 'site-directory-sync-v410.js'
      - 'review-dashboard-v410.js'
      - 'interaction-v410.js'
      - 'report-v410.js'
      - 'report-v410.css'
      - 'stable410.html'
      - 'version.json'
      - '.github/workflows/v410-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check auth-core-v410.js
          node --check app-control-v410.js
          node --check field-ui-v410.js
          node --check incidents-v410.js
          node --check incident-sync-v410.js
          node --check site-directory-v410.js
          node --check site-directory-sync-v410.js
          node --check review-dashboard-v410.js
          node --check interaction-v410.js
          node --check report-v410.js
      - name: Entry and permission rules
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json

          class Refs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'): self.refs.append(d['src'])
                  if tag=='link' and d.get('href'): self.refs.append(d['href'])

          html=Path('stable410.html').read_text(encoding='utf-8')
          p=Refs(); p.feed(html)
          missing=[]
          for ref in p.refs:
              path=urlsplit(ref).path
              if path and not Path(path).exists(): missing.append(path)
          if missing:
              raise SystemExit('Missing stable410 references: '+', '.join(sorted(set(missing))))
          if 'src="incidents.js' in html:
              raise SystemExit('Legacy incidents.js is still loaded')
          if 'test-88cc-v341.js' in html:
              raise SystemExit('Legacy 88CC test runtime is still loaded')
          for required in ['incidents-v410.js?v=4.1.0-r5','field-ui-v410.js?v=4.1.0-r5','field-ui-v410.css?v=4.1.0-r5','auth-core-v410.js?v=4.1.0-r7','review-dashboard-v410.js','report-v410.js?v=4.1.0-r6','report-v410.css?v=4.1.0-r6']:
              if required not in html:
                  raise SystemExit('Missing required stable reference: '+required)
          if 'field-report-v370.js' in html or 'field-report-v370.css' in html or 'event-type-safe-v380.js' in html:
              raise SystemExit('Legacy report patch is still loaded in stable410')
          src=Path('incidents-v410.js').read_text(encoding='utf-8')
          for rule in ["i.status!=='rejected'", "position(u)==='현장소장'", "u.role==='worker'&&isAuthor(i,u)", "id=\"rejectInc\"", "i.status='reported'"]:
              if rule not in src:
                  raise SystemExit('Missing incident permission rule: '+rule)
          report=Path('report-v410.js').read_text(encoding='utf-8')
          for rule in ["data-report-type=\"person\"", "data-report-type=\"property\"", "diagnosis410", "medicalCost410", "damagedItem410", "repairCost410"]:
              if rule not in report:
                  raise SystemExit('Missing person/property report rule: '+rule)
          auth=Path('auth-core-v410.js').read_text(encoding='utf-8')
          if "option.kind==='hq'||option.requiresPassword" not in auth:
              raise SystemExit('Site manager password routing is missing')
          meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if meta.get('build')!='stable-410-r7':
              raise SystemExit('version.json build is not stable-410-r7')
          if meta.get('loginAutoUpdate') is not False:
              raise SystemExit('loginAutoUpdate must remain false for iOS focus stability')
          print(f'OK: {len(p.refs)} local asset references resolved; r7 rules present')
      - name: Live login API roles
        shell: python
        run: |
          import json, urllib.request, urllib.error
          API='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-login-v410'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(body):
              req=urllib.request.Request(API,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: payload=json.loads(e.read().decode())
                  except Exception: payload={}
                  return e.code,payload
          code,lookup=call({'action':'lookup','name':'김상호'})
          assert code==200 and any(o.get('siteId')=='s01' and o.get('requiresPassword') is True for o in lookup.get('options',[])), (code,lookup)
          code,_=call({'action':'login_site','name':'김상호','siteId':'s01'})
          assert code==401, code
          code,worker=call({'action':'login_site','name':'김태진','siteId':'s21'})
          assert code==200 and worker.get('person',{}).get('access_role')=='worker', (code,worker)
          code,kgm_lookup=call({'action':'lookup','name':'김건모'})
          assert code==200 and any(o.get('siteId')=='s32' and o.get('affiliationLabel')=='88CC' and o.get('requiresPassword') is False for o in kgm_lookup.get('options',[])), (code,kgm_lookup)
          code,kgm=call({'action':'login_site','name':'김건모','siteId':'s32'})
          assert code==200 and kgm.get('person',{}).get('name')=='김건모' and kgm.get('person',{}).get('site_name')=='88CC' and kgm.get('person',{}).get('access_role')=='worker', (code,kgm)
          print('OK: manager password required; worker logins including 88CC 김건모 are valid')
