name: production smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'auth-v411.js'
      - 'app-shell-v411.js'
      - 'field-ui-v411.js'
      - 'field-ui-v411.css'
      - 'field-incidents-v411.js'
      - 'platform-state-v411.js'
      - 'incidents-v410.js'
      - 'incident-sync-v411.js'
      - 'site-directory-v410.js'
      - 'site-directory-sync-v410.js'
      - 'site-admin-v400.js'
      - 'review-dashboard-v410.js'
      - 'interaction-v410.js'
      - 'app-control-v410.js'
      - 'report-v410.js'
      - 'report-v410.css'
      - 'stable411.html'
      - '.github/workflows/v410-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check auth-v411.js
          node --check platform-state-v411.js
          node --check app-shell-v411.js
          node --check field-ui-v411.js
          node --check field-incidents-v411.js
          node --check incidents-v410.js
          node --check incident-sync-v411.js
          node --check site-directory-v410.js
          node --check site-directory-sync-v410.js
          node --check site-admin-v400.js
          node --check review-dashboard-v410.js
          node --check interaction-v410.js
          node --check app-control-v410.js
          node --check report-v410.js
      - name: Production compact report controls
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json

          meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert meta.get('stableEntry')=='stable411.html', meta
          assert meta.get('build')=='stable-411-r6', meta
          assert meta.get('version')=='4.1.1', meta
          assert meta.get('loginAutoUpdate') is False, meta

          index=Path('index.html').read_text(encoding='utf-8')
          assert 'stable411.html' in index and 'build=r6' in index
          html=Path('stable411.html').read_text(encoding='utf-8')

          class Refs(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'): self.refs.append(d['src']); self.scripts.append(d['src'])
                  if tag=='link' and d.get('href'): self.refs.append(d['href'])
          p=Refs();p.feed(html)
          missing=[]
          for ref in p.refs:
              path=urlsplit(ref).path
              if path and not Path(path).exists(): missing.append(path)
          assert not missing, missing

          required=[
            'auth-v411.js?v=4.1.1-r6','report-v410.js?v=4.1.1-r6',
            'field-ui-v411.js?v=4.1.1-r6','field-incidents-v411.js?v=4.1.1-r6',
            'field-ui-v411.css?v=4.1.1-r6','report-v410.css?v=4.1.1-r6',
            'incidents-v410.js?v=4.1.1-r6','app-shell-v411.js?v=4.1.1-r6'
          ]
          for item in required: assert item in html, 'missing '+item
          assert p.scripts[-1]=='app-shell-v411.js?v=4.1.1-r6', p.scripts[-3:]

          report_css=Path('report-v410.css').read_text(encoding='utf-8')
          for rule in [
              'input[type="date"],.report410-section input[type="time"]',
              'min-height:44px!important;height:44px!important',
              '.report410-change{appearance:none',
              'border:2px solid #173b66!important',
              'width:auto!important;min-height:42px!important'
          ]:
              assert rule in report_css, 'missing compact report rule: '+rule

          report=Path('report-v410.js').read_text(encoding='utf-8')
          assert '← 사고 종류 변경' in report
          assert '← 현장 홈으로' in report

          fi=Path('field-incidents-v411.js').read_text(encoding='utf-8')
          assert '우리 사업장 사고 요약' in fi and '내가 보고한 사고' in fi
          assert '일반근로자에게는 같은 사업장 사고의 업무상 필요한 요약정보만 표시합니다.' not in fi
          public_block=fi.split('function workerPublicCards(arr){',1)[1].split('function myReportCards',1)[0]
          for forbidden in ['reporterName','injuredName','diagnosis','medicalCost','repairCost','photos','i.summary','rejectionNote']:
              assert forbidden not in public_block, 'private field leaked into worker public summary: '+forbidden

          print('OK: r6 compact date/time controls, matching back button and simplified record intro verified')
      - name: Live login API roles
        shell: python
        run: |
          import json, urllib.request, urllib.error
          API='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-login-v410'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(body):
              req=urllib.request.Request(API,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: payload=json.loads(e.read().decode())
                  except Exception: payload={}
                  return e.code,payload
          code,kgm_lookup=call({'action':'lookup','name':'김건모'})
          assert code==200 and any(o.get('siteId')=='s32' and o.get('requiresPassword') is False for o in kgm_lookup.get('options',[])),(code,kgm_lookup)
          code,kgm=call({'action':'login_site','name':'김건모','siteId':'s32'})
          assert code==200 and kgm.get('person',{}).get('access_role')=='worker',(code,kgm)
          print('OK: live worker login still valid')
