name: production smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'auth-v411.js'
      - 'app-shell-v411.js'
      - 'field-ui-v411.js'
      - 'field-ui-v411.css'
      - 'field-incidents-v411.js'
      - 'platform-state-v411.js'
      - 'incidents-v410.js'
      - 'incident-sync-v411.js'
      - 'site-directory-v410.js'
      - 'site-directory-sync-v410.js'
      - 'site-admin-v400.js'
      - 'review-dashboard-v410.js'
      - 'interaction-v410.js'
      - 'app-control-v410.js'
      - 'report-v410.js'
      - 'report-v410.css'
      - 'stable411.html'
      - '.github/workflows/v410-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check auth-v411.js
          node --check platform-state-v411.js
          node --check app-shell-v411.js
          node --check field-ui-v411.js
          node --check field-incidents-v411.js
          node --check incidents-v410.js
          node --check incident-sync-v411.js
          node --check site-directory-v410.js
          node --check site-directory-sync-v410.js
          node --check site-admin-v400.js
          node --check review-dashboard-v410.js
          node --check interaction-v410.js
          node --check app-control-v410.js
          node --check report-v410.js
      - name: Production r8 data and layout rules
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json

          meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert meta.get('stableEntry')=='stable411.html', meta
          assert meta.get('build')=='stable-411-r8', meta
          assert meta.get('version')=='4.1.1', meta
          assert meta.get('loginAutoUpdate') is False, meta

          index=Path('index.html').read_text(encoding='utf-8')
          assert 'stable411.html' in index and 'build=r8' in index
          html=Path('stable411.html').read_text(encoding='utf-8')

          class Refs(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'): self.refs.append(d['src']); self.scripts.append(d['src'])
                  if tag=='link' and d.get('href'): self.refs.append(d['href'])
          p=Refs();p.feed(html)
          missing=[]
          for ref in p.refs:
              path=urlsplit(ref).path
              if path and not Path(path).exists(): missing.append(path)
          assert not missing, missing
          for item in [
              'auth-v411.js?v=4.1.1-r8','report-v410.js?v=4.1.1-r8',
              'field-incidents-v411.js?v=4.1.1-r8','report-v410.css?v=4.1.1-r8',
              'incidents-v410.js?v=4.1.1-r8','incident-sync-v411.js?v=4.1.1-r8',
              'app-shell-v411.js?v=4.1.1-r8'
          ]: assert item in html, 'missing '+item
          assert p.scripts[-1]=='app-shell-v411.js?v=4.1.1-r8', p.scripts[-3:]

          css=Path('report-v410.css').read_text(encoding='utf-8')
          for rule in [
              '.report410-overview-grid{grid-template-columns:minmax(0,1fr)!important',
              'contain:inline-size',
              '-webkit-appearance:none!important',
              'max-inline-size:100%!important',
              '::-webkit-date-and-time-value'
          ]: assert rule in css, 'missing iOS overview containment rule: '+rule

          sync=Path('incident-sync-v411.js').read_text(encoding='utf-8')
          for rule in [
              'function replaceFromServer(remote)',
              'persistRemote(next)',
              'if(!serverReady){await pull(true);serverReady=true;dirty=false;return}',
              'window.enlIncidentServerReady=()=>serverReady',
              "window.ENL_INCIDENT_SYNC_VERSION='4.1.1-r8'"
          ]: assert rule in sync, 'missing authoritative sync rule: '+rule
          assert 'const map=new Map((data.incidents||[]).map' not in sync

          shell=Path('app-shell-v411.js').read_text(encoding='utf-8')
          for rule in [
              'async function openSafetyReview(id,u)',
              'await window.enlIncidentPullNow()',
              'openIncidentModal(i.id,true,u)',
              "root.querySelectorAll('[data-safety-inc]').forEach(b=>b.onclick=()=>openSafetyReview",
              "root.querySelectorAll('[data-inc-id]').forEach(r=>r.onclick=()=>openSafetyReview",
              'data-safety-site=',
              '.slice(0,3)'
          ]: assert rule in shell, 'missing safety server review rule: '+rule

          report=Path('report-v410.js').read_text(encoding='utf-8')
          assert 'window.enlEditIncidentInReportForm' in report
          fi=Path('field-incidents-v411.js').read_text(encoding='utf-8')
          assert '부상 형태:' in fi and '피해금액 약' in fi

          print('OK: r8 iOS width containment, authoritative server replacement and safety review routing verified')
      - name: Live login API roles
        shell: python
        run: |
          import json, urllib.request, urllib.error
          API='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-login-v410'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(body):
              req=urllib.request.Request(API,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: payload=json.loads(e.read().decode())
                  except Exception: payload={}
                  return e.code,payload
          code,kgm_lookup=call({'action':'lookup','name':'김건모'})
          assert code==200 and any(o.get('siteId')=='s32' and o.get('requiresPassword') is False for o in kgm_lookup.get('options',[])),(code,kgm_lookup)
          code,kgm=call({'action':'login_site','name':'김건모','siteId':'s32'})
          assert code==200 and kgm.get('person',{}).get('access_role')=='worker',(code,kgm)
          print('OK: live worker login still valid')
