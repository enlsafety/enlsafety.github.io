      - 'auth-v411.js'
      - 'site-admin-v415.js'
      - 'notification-profile-v441.js'
      - 'login-layout-v412.js'
      - 'incidents-v410.js'
      - 'incident-sync-v411.js'
      - 'report-v410.js'
      - 'field-incidents-v411.js'
      - 'app-shell-v411.js'
      - 'reader-ui-v414.js'
      - 'incident-stats-v426.js'
      - 'reader-experience-v424.js'
      - 'workflow-v412.js'
      - 'incident-flow-v440.js'
      - 'workflow-lifecycle-v413.js'
      - 'workflow-prevention-v429.js'
      - 'incident-review-v431.js'
      - 'production-cleanup-v431.js'
      - 'workflow-enhancements-v432.js'
      - 'site-admin-hotfix-v433.js'
      - 'personnel-management-v434.js'
      - 'legal-review-v435.js'
      - 'industrial-report-v436.js'
      - 'closed-incident-reopen-v438.js'
      - 'official-records-v439.js'
      - 'management-approval-v448.js'
      - 'responsive-v432.css'
      - 'incident-excel-v421.js'
      - 'pwa-push-v418.js'
      - 'push-session-v425.js'
      - 'hq-notification-status-v437.js'
      - 'sw-v418.js'
      - 'manifest.webmanifest'
      - 'required-fields-v453.js'
      - '.github/workflows/v410-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'core.js'
      - 'version.json'
      - 'stable412.html'
      - 'auth-v411.js'
      - 'site-admin-v415.js'
      - 'notification-profile-v441.js'
      - 'login-layout-v412.js'
      - 'incidents-v410.js'
      - 'incident-sync-v411.js'
      - 'report-v410.js'
      - 'field-incidents-v411.js'
      - 'app-shell-v411.js'
      - 'reader-ui-v414.js'
      - 'incident-stats-v426.js'
      - 'reader-experience-v424.js'
      - 'workflow-v412.js'
      - 'incident-flow-v440.js'
      - 'workflow-lifecycle-v413.js'
      - 'workflow-prevention-v429.js'
      - 'incident-review-v431.js'
      - 'production-cleanup-v431.js'
      - 'workflow-enhancements-v432.js'
      - 'site-admin-hotfix-v433.js'
      - 'personnel-management-v434.js'
      - 'legal-review-v435.js'
      - 'industrial-report-v436.js'
      - 'closed-incident-reopen-v438.js'
      - 'official-records-v439.js'
      - 'management-approval-v448.js'
      - 'responsive-v432.css'
      - 'incident-excel-v421.js'
      - 'pwa-push-v418.js'
      - 'push-session-v425.js'
      - 'hq-notification-status-v437.js'
      - 'sw-v418.js'
      - 'manifest.webmanifest'
      - 'required-fields-v453.js'
      - '.github/workflows/v410-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          for f in core.js auth-v411.js notification-profile-v441.js login-layout-v412.js incidents-v410.js incident-sync-v411.js report-v410.js field-incidents-v411.js app-shell-v411.js reader-ui-v414.js incident-stats-v426.js reader-experience-v424.js workflow-v412.js incident-flow-v440.js workflow-lifecycle-v413.js workflow-prevention-v429.js incident-review-v431.js production-cleanup-v431.js workflow-enhancements-v432.js site-admin-v415.js site-admin-hotfix-v433.js personnel-management-v434.js legal-review-v435.js industrial-report-v436.js closed-incident-reopen-v438.js official-records-v439.js management-approval-v448.js incident-excel-v421.js pwa-push-v418.js push-session-v425.js hq-notification-status-v437.js required-fields-v453.js sw-v418.js; do
            node --check "$f"
          done

      - name: Production runtime wiring
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json

          meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert meta.get('build')=='stable-4439-r1',meta
          assert meta.get('stableEntry')=='stable412.html',meta
          assert meta.get('version')=='4.4.39' and meta.get('currentStableVersion')=='4.4.39',meta

          index=Path('index.html').read_text(encoding='utf-8')
          for x in ["const BUILD='4439-r1'",'beforeinstallprompt','stable412.html?entry=root&build=4439-r1',"/sw-v418.js?v=4.4.32-startup-cache1"]: assert x in index,x

          html=Path('stable412.html').read_text(encoding='utf-8')
          required=[
            'enl-build" content="4.4.39-r1',
            'incident-sync-v411.js?v=4.4.34-r1&amp;fix=proof-reuse1',
            'workflow-prevention-v429.js?v=4.4.38-r1&amp;fix=prevention-alert1',
            'workflow-lifecycle-v413.js?v=4.4.14-r1&amp;fix=historical-transfer1',
            'incident-review-v431.js?v=4.1.2-r31&amp;fix=review-preview1',
            'production-cleanup-v431.js?v=4.4.38-r1&amp;fix=test-hq-cleanup1',
            'workflow-enhancements-v432.js?v=4.4.32-r1&amp;fix=startup-defer1',
            'site-admin-hotfix-v433.js?v=4.1.2-r33&amp;fix=site-api1',
            'personnel-management-v434.js?v=4.4.12-r1&amp;fix=hq-rank-align1',
            'legal-review-v435.js?v=4.1.2-r35&amp;fix=legal-simplify1',
            'industrial-report-v436.js?v=4.4.29-r1&amp;fix=deadline-confirmation3-required1',
            'closed-incident-reopen-v438.js?v=4.4.14-r1&amp;fix=historical-transfer1',
            'official-records-v439.js?v=4.4.39-r1&amp;fix=statutory-record1',
            'incidents-v410.js?v=4.4.39-r1&amp;fix=no-read-confirm1',
            'report-v410.js?v=4.4.35-r1&amp;fix=form-guidance1',
            'field-incidents-v411.js?v=4.4.37-r1&amp;fix=field-copy2',
            'app-shell-v411.js?v=4.4.38-r1&amp;fix=hq-attention1',
            'reader-ui-v414.js?v=4.4.37-r1&amp;fix=hq-dashboard1',
            'reader-experience-v424.js?v=4.4.39-r1&amp;fix=no-read-confirm1',
            'incident-flow-v440.js?v=4.4.39-r1&amp;fix=no-confirm-history1',
          ]
          for x in required: assert x in html,x
          assert 'session-refresh-v412.js?v=4.4.34-r1&amp;fix=proof-reuse1' in html
          assert 'core.js?v=4.4.35-r1&amp;fix=attachment-preview1' in html
          assert 'auth-v411.js?v=4.4.38-r1&amp;fix=hq-cache-prune1' in html
          assert 'login-layout-v412.js?v=4.2.7-r1&amp;fix=guide-removed1' in html
          assert 'workflow-v412.js?v=4.4.39-r1&amp;fix=comment-empty1' in html
          assert 'field-ui-v411.js?v=4.4.37-r1&amp;fix=field-copy1' in html
          assert 'app-control-v410.js?v=4.4.32-r1&amp;fix=startup-defer1' in html
          assert 'incident-stats-v426.js?v=4.4.28-r1' in html
          assert 'required-fields-v453.js?v=4.4.31-r1' in html
          assert 'ui-stability-v422.js?v=4.4.29-r1&amp;fix=hq-email-edit1-required1' in html
          assert 'reader-ack-ux-v423.js' not in html
          assert 'historical-transfer-v449.js?v=4.4.29-r1&amp;fix=required1' in html
          assert 'site-dashboard-v450.js?v=4.4.33-r1&amp;fix=map-lock1' in html
          assert 'site-master-seed-v400.js?v=4.4.24-r1' in html
          dash=Path('site-dashboard-v450.js').read_text(encoding='utf-8')
          for x in ['4.4.33-map-lock1','data-map-lock','map-interactive','touch-action:pan-y','if(!interactive)return;e.preventDefault()']: assert x in dash,x
          assert Path('korea-map-natural-earth-10m.svg').exists()
          mapjs=Path('site-dashboard-v450.js').read_text(encoding='utf-8')
          assert "view()!=='stats'" in mapjs and "view()==='stats'" in mapjs
          assert 'korea-map-natural-earth-10m.svg?v=4.4.19-r1' in mapjs
          stats=Path('incident-stats-v426.js').read_text(encoding='utf-8')
          for x in ['4.4.28-dashboard-filter-simplify1','data-stats-filter="all"','data-stats-month','최근 발생일 순','data-stats-inc','stats426-site-attention','stats426-site-manage','관심요망','관리필요']: assert x in stats,x
          required_fields=Path('required-fields-v453.js').read_text(encoding='utf-8')
          for x in ["4.4.31-date-confirm-perf1","enl432-required-empty","enl432-required-filled","선택하세요","MutationObserver","aria-required"]: assert x in required_fields,x
          assert 'cloneNode(' not in required_fields
          assert 'queueMicrotask(()=>{queued=false;scan(document)})' not in required_fields
          report=Path('report-v410.js').read_text(encoding='utf-8')
          assert 'report410-picker-placeholder' in report and '선택하세요' in report
          assert "return {date:'',time:''}" in report
          hist=Path('historical-transfer-v449.js').read_text(encoding='utf-8')
          for x in ['<select id="hEvent" required><option value="">선택</option>','<select id="hAction" required><option value="">선택</option>','<select id="hFollow" required><option value="">선택</option>']: assert x in hist,x
          assert "siteStatus='active'" in stats and "siteId=''" in stats
          assert 'id="stats426Status"' not in stats and 'id="stats426Site"' not in stats
          flow=Path('incident-flow-v440.js').read_text(encoding='utf-8')
          for x in ['4.4.39-no-confirm-history1','30분 이내 또는 현장 이탈 전','보완대기','보완검토대기','사고보고 최종승인','wf440QueueSig','wf440DecorSig']: assert x in flow,x
          for x in ['addAckSection(','recordView(','사고보고 확인 기록','최초 조회기록','readReceipts']: assert x not in flow,x
          assert 'window.enlAttachmentGalleryHtml' in flow and 'window.enlBindAttachmentOpen' in flow
          assert 'repairCostPending=repair<=0' in flow
          core=Path('core.js').read_text(encoding='utf-8')
          for x in ['attachmentPreviewHtml','hydrateAttachmentPreviews','attach-pdf-preview411','window.enlHydrateAttachmentPreviews','signAttachments(paths)']: assert x in core,x
          incidents=Path('incidents-v410.js').read_text(encoding='utf-8')
          for x in ["'supplement'?'보완대기'","'supplement_submitted'?'보완검토대기'","reported','supplement','supplement_submitted','approved','closed"]: assert x in incidents,x
          for x in ['4.4.35-full-detail1','환경적 요인','행동적 요인','견적 / 비용 상세내역','특이사항','사후 보완 예정']: assert x in incidents,x
          report=Path('report-v410.js').read_text(encoding='utf-8')
          assert "['preventionPlan410','재발 방지 대책']" not in report
          assert '사진 없이 우선 보고할 수 있습니다.' in report and '현장사진 또는 PDF 파일을 1개 이상 등록해 주세요.' not in report
          for x in ['4.4.35-form-guidance1','사후 보완 예정','data-auto-pending','environmentCause410','behaviorCause410','specialNote410','repairCostPending']: assert x in report,x
          assert report.count('placeholder="예:') >= 12, report.count('placeholder="예:')
          field=Path('field-incidents-v411.js').read_text(encoding='utf-8')
          for x in ["v==='supplement'?'보완대기'","v==='supplement_submitted'?'보완검토대기'","4.4.37-field-copy2","보완자료 작성하기","사고 조치 작성하기","data-field-group"]: assert x in field,x
          field_ui=Path('field-ui-v411.js').read_text(encoding='utf-8')
          for x in ["4.4.37-field-copy1","field-six-new","보완요청","enlOpenPwaNotificationSettings"]: assert x in field_ui,x
          reader=Path('reader-ui-v414.js').read_text(encoding='utf-8')
          for x in ['4.4.37-hq-dashboard1','검토대기·보완대기 단계에서는 조회만 가능하며','supplement_submitted']: assert x in reader,x
          control=Path('app-control-v410.js').read_text(encoding='utf-8')
          for x in ['POST_LOGIN_GRACE_MS=15000','function sameStableVersion(target)','if(target&&sameStableVersion(target)){saveEpoch(epoch)','already_current']: assert x in control,x
          auth=Path('auth-v411.js').read_text(encoding='utf-8')
          for x in ['4.4.38-hq-cache-prune1','remote=Array.isArray(r.users)?r.users:[]','ids.has(String(v.id||\'\'))']: assert x in auth,x
          for x in ["const duplicateSiteName=siteIds.length>1;",'login411-aff-duplicate','동명이인이 있습니다. 본인 사업장을 꼭 확인해 선택해 주세요.',"details.dataset.selectedLabel411=label",'login411-aff-selected','details.open=false','소속사업장을 선택해 주세요.','비밀번호를 입력하세요.','autofocus','focusPassword()']: assert x in auth,x
          assert 'login411-guide' not in auth and '로그인 순서' not in auth
          assert '이앤엘 사고보고앱 v4.1.1' not in auth and 'deployedVersion()' in auth and 'window.ENL_DEPLOY_VERSION' in auth
          layout=Path('login-layout-v412.js').read_text(encoding='utf-8')
          for x in ["const selectedLabel=details.dataset.selectedLabel411||''","if(selectedLabel)details.open=false",'login411-summary-label']: assert x in layout,x
          assert 'GUIDE_HTML' not in layout and "grid-row:4" in layout
          assert 'hq-notification-status-v437.js?v=4.4.12-r1&amp;fix=hq-align1' in html
          assert 'pwa-push-v418.js?v=4.4.36-r1&amp;fix=push-repair1' in html
          assert 'push-session-v425.js?v=4.4.36-r1&amp;fix=subscription-repair1' in html
          assert 'notification-profile-v441.js?v=4.4.7-r1&amp;fix=server-dispatch1' in html
          ps=Path('push-session-v425.js').read_text(encoding='utf-8')
          assert "4.4.36-subscription-repair1" in ps and "enlEnsurePushSubscription" in ps
          pwa=Path('pwa-push-v418.js').read_text(encoding='utf-8')
          for x in ["4.4.36-push-repair1","ensurePushSubscriptionSilently","window.enlEnsurePushSubscription","window.enlOpenPwaNotificationSettings"]: assert x in pwa,x
          assert "검토대기 단계 상세 열람은 긴급사고에 한해" not in ps
          assert "!['approved','closed'].includes(status)&&!urgent(i)" not in ps
          assert 'site-admin-v415.js?v=4.4.29-r1&amp;fix=required1' in html
          profile=Path('notification-profile-v441.js').read_text(encoding='utf-8')
          for x in ['profile_get','profile_update','긴급사고는 앱 푸시·이메일 OFF 설정과 관계없이 강제 수신됩니다.','4.4.7-notification-profile2']: assert x in profile,x
          assert 'enl-email-v441' not in profile and 'emailFlush' not in profile
          hq=Path('hq-notification-status-v437.js').read_text(encoding='utf-8')
          sw=Path('sw-v418.js').read_text(encoding='utf-8')
          assert 'data-pm434-hq-edit' in hq and 'data-pm434-hq-pw' in hq
          assert 'PUSH_CONFIRM_API' in sw and "action:'ack_test_token'" in sw and "action:'confirm',title:'확인'" in sw
          for x in ["4.4.32-startup-cache1","PRECACHE","fetchWithTimeout","cache.match(req)","stable412.html?offline=1"]: assert x in sw,x
          assert "status==='confirmed'" in hq and '수신 확인' in hq
          assert html.index('personnel-management-v434.js') < html.index('hq-notification-status-v437.js')

          class R(HTMLParser):
            def __init__(self): super().__init__(); self.refs=[]; self.scripts=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='script' and d.get('src'): self.refs.append(d['src']); self.scripts.append(d['src'])
              if t=='link' and d.get('href'): self.refs.append(d['href'])
          p=R();p.feed(html)
          missing=[]
          for ref in p.refs:
            path=urlsplit(ref).path.lstrip('/')
            if path and not Path(path).exists(): missing.append(path)
          assert not missing,missing
          hotfix='site-admin-hotfix-v433.js?v=4.1.2-r33&fix=site-api1'
          personnel='personnel-management-v434.js?v=4.4.12-r1&fix=hq-rank-align1'
          legal='legal-review-v435.js?v=4.1.2-r35&fix=legal-simplify1'
          industrial='industrial-report-v436.js?v=4.4.29-r1&fix=deadline-confirmation3-required1'
          assert p.scripts.index(hotfix) < p.scripts.index(personnel) < p.scripts.index(legal) < p.scripts.index(industrial)

          cleanup=Path('production-cleanup-v431.js').read_text(encoding='utf-8')
          for x in ['4.4.38-test-hq-cleanup1','테스트 경영진','테스트 관리자','테스트 안전관리자']: assert x in cleanup,x
          workflow=Path('workflow-v412.js').read_text(encoding='utf-8')
          assert '4.4.39-comment-empty1' in workflow and 'data-enl-optional="1"' in workflow
          assert '의견을 불러오지 못했습니다.' not in workflow and '<div class="wf412-empty">-</div>' in workflow
          assert 'id="wf412CommentBody" maxlength="2000" required' not in workflow
          assert "const VERSION='4.4.38-test-hq-cleanup1'" in cleanup
          assert "new Set(['u-field-demo','u-final-demo'])" in cleanup
          assert "u-safety-demo" in cleanup and 'must not be removed' in cleanup

          pm=Path('personnel-management-v434.js').read_text(encoding='utf-8')
          for x in [
            "const VERSION='4.4.12-hq-rank-align1'",
            '/functions/v1/enl-personnel-v434',
            "['personnel_pull','personnel_upsert','personnel_delete']",
            'manager_name_conflict',
            'duplicate_personnel',
            '일반근로자를 등록·수정·퇴사·삭제',
            'registered_count:general+field',
            'window.enlSyncHqUsers=async function',
            "currentView||'')==='more'",
          ]: assert x in pm,x

          legal_js=Path('legal-review-v435.js').read_text(encoding='utf-8')
          for x in [
            "const VERSION='4.3.5-legal-simplify1'",
            '법정 보고 검토 필요',
            "modal.querySelector('.inc411-priority-box')?.remove()",
            "modal.querySelector('#saveNote')?.remove()",
            "legalReviewStatus='reviewed'",
          ]: assert x in legal_js,x

          industrial_js=Path('industrial-report-v436.js').read_text(encoding='utf-8')
          for x in [
            "const VERSION='4.4.0-industrial-compliance2'",
            '/functions/v1/enl-industrial-report-v436',
            '주민등록번호 앞 7자리',
            '공식서식 PDF 미리보기',
            '수동보완',
            '정정본 만들기',
            "action:'render_pdf'",
            '근로자대표 확인 방식',
            '근로자대표가 없는 경우에는 재해자 본인의 확인',
            '재해 발생일로부터 1개월 이내',
            'reportDeadline',
            'd.getFullYear()',
            'd.getMonth()+1',
          ]: assert x in industrial_js,x

          prevention=Path('workflow-prevention-v429.js').read_text(encoding='utf-8')
          for x in ['4.4.38-prevention-alert1','prev429-nav-alert','prev429-nav-attention','preventionPlanMissing']: assert x in prevention,x
          for x in ['사고 접수완료','재발방지계획 등록','실제 실시한 재발방지조치','재발방지조치 확인완료']: assert x in prevention,x
          enhancement=Path('workflow-enhancements-v432.js').read_text(encoding='utf-8')
          for x in ["confirm('수신완료 처리 하시겠습니까?')",'실제 조치 완료일 *','attachments().length<1',"currentView='stats'"]: assert x in enhancement,x
          official=Path('official-records-v439.js').read_text(encoding='utf-8')
          for x in ['4.4.39-statutory-record1','PDF 보고서 출력','법정 사고기록','근로자 인적사항','재해 발생 원인 및 과정','재해 재발방지 계획','backup_restore','delete_incident','공식기록 · 백업/복원']: assert x in official,x
          for x in ['공식 사고기록 · 확인이력','사고보고 무결성 해시','최종 기록 해시','data-official439-audit','사고 변경·확인 감사로그','enlOfficialAuditOpen']: assert x not in official,x
          assert '전자결재 문서' not in official and '공식 전자결재 기록' not in official
          for x in ['supplement_request','보완요청','supplement_submit','보완자료 제출','corrective_approve','재발방지조치 승인','내용 확인기록']: assert x in official,x
          approval=Path('management-approval-v448.js').read_text(encoding='utf-8')
          for x in ["4.4.39-crisp-sign1","function signable(i)","st==='approved'||(st==='closed'&&act==='approved')",'aria-label="본인 결재하기"',"serverOk=true","font-size:10.5px","text-rendering:geometricPrecision"]: assert x in approval,x
