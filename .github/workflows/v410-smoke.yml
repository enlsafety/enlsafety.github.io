name: production smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'auth-v411.js'
      - 'app-shell-v411.js'
      - 'field-ui-v411.js'
      - 'field-ui-v411.css'
      - 'field-incidents-v411.js'
      - 'platform-state-v411.js'
      - 'incidents-v410.js'
      - 'incident-sync-v411.js'
      - 'site-directory-v410.js'
      - 'site-directory-sync-v410.js'
      - 'site-admin-v400.js'
      - 'review-dashboard-v410.js'
      - 'interaction-v410.js'
      - 'app-control-v410.js'
      - 'report-v410.js'
      - 'report-v410.css'
      - 'stable411.html'
      - '.github/workflows/v410-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check auth-v411.js
          node --check platform-state-v411.js
          node --check app-shell-v411.js
          node --check field-ui-v411.js
          node --check field-incidents-v411.js
          node --check incidents-v410.js
          node --check incident-sync-v411.js
          node --check site-directory-v410.js
          node --check site-directory-sync-v410.js
          node --check site-admin-v400.js
          node --check review-dashboard-v410.js
          node --check interaction-v410.js
          node --check app-control-v410.js
          node --check report-v410.js
      - name: Production responsive privacy routing
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json,re

          meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert meta.get('stableEntry')=='stable411.html', meta
          assert meta.get('build')=='stable-411-r5', meta
          assert meta.get('version')=='4.1.1', meta
          assert meta.get('loginAutoUpdate') is False, meta

          index=Path('index.html').read_text(encoding='utf-8')
          assert 'stable411.html' in index and 'build=r5' in index
          html=Path('stable411.html').read_text(encoding='utf-8')

          class Refs(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'): self.refs.append(d['src']); self.scripts.append(d['src'])
                  if tag=='link' and d.get('href'): self.refs.append(d['href'])
          p=Refs();p.feed(html)
          missing=[]
          for ref in p.refs:
              path=urlsplit(ref).path
              if path and not Path(path).exists(): missing.append(path)
          assert not missing, missing

          required=[
            'auth-v411.js?v=4.1.1-r5','report-v410.js?v=4.1.1-r5',
            'field-ui-v411.js?v=4.1.1-r5','field-incidents-v411.js?v=4.1.1-r5',
            'field-ui-v411.css?v=4.1.1-r5','report-v410.css?v=4.1.1-r5',
            'incidents-v410.js?v=4.1.1-r5','app-shell-v411.js?v=4.1.1-r5'
          ]
          for item in required: assert item in html, 'missing '+item
          assert p.scripts[-1]=='app-shell-v411.js?v=4.1.1-r5', p.scripts[-3:]

          # iPhone/Galaxy narrow width, Fold/tablet wide width: controls must shrink inside minmax grid.
          report_css=Path('report-v410.css').read_text(encoding='utf-8')
          for rule in [
              'grid-template-columns:repeat(2,minmax(0,1fr))',
              '.report410-grid>*{min-width:0;max-width:100%}',
              'width:100%;max-width:100%;min-width:0;box-sizing:border-box',
              'input[type="date"],.report410-section input[type="time"]',
              '@media(max-width:700px)',
              'grid-template-columns:minmax(0,1fr)',
              '@media(max-width:430px)'
          ]:
              assert rule in report_css, 'missing responsive report rule: '+rule

          field_css=Path('field-ui-v411.css').read_text(encoding='utf-8')
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in field_css
          assert 'aspect-ratio:1/1' in field_css

          fi=Path('field-incidents-v411.js').read_text(encoding='utf-8')
          for rule in [
              '우리 사업장 사고 요약','내가 보고한 사고',
              '개인 식별정보·진단정보·금액·사진·상세 경위는 표시하지 않습니다.',
              'window.enlRenderFieldRecords=renderRecords','window.enlRenderFieldActions=renderActions',
              "isManager(u)?siteIncidents(u):myIncidents(u)",
              "data-field-open=", "data-field-edit="
          ]:
              assert rule in fi, 'missing field privacy/manager rule: '+rule
          public_block=fi.split('function workerPublicCards(arr){',1)[1].split('function myReportCards',1)[0]
          for forbidden in ['reporterName','injuredName','diagnosis','medicalCost','repairCost','photos','i.summary','rejectionNote']:
              assert forbidden not in public_block, 'private field leaked into worker public summary: '+forbidden

          access=Path('incidents-v410.js').read_text(encoding='utf-8')
          for rule in [
              "if(!['reported','rejected'].includes(i.status))return false",
              'if(isManager(u))return true',
              'return u.role===\'worker\'&&isAuthor(i,u)',
              'return sameSite(i,u)&&isManager(u)',
              "previousStatus==='reported'?'withdrawn_and_resubmitted':'resubmitted'"
          ]:
              assert rule in access, 'missing incident access rule: '+rule

          shell=Path('app-shell-v411.js').read_text(encoding='utf-8')
          assert "window.enlRenderFieldRecords?window.enlRenderFieldRecords(root,u):renderUnifiedIncidents(root,u)" in shell
          assert shell.count('renderShell=function(u)')==1

          print('OK: r5 responsive report controls, worker privacy summary, own-report editing and manager access verified')
      - name: Live login API roles
        shell: python
        run: |
          import json, urllib.request, urllib.error
          API='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-login-v410'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(body):
              req=urllib.request.Request(API,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: payload=json.loads(e.read().decode())
                  except Exception: payload={}
                  return e.code,payload
          code,kgm_lookup=call({'action':'lookup','name':'김건모'})
          assert code==200 and any(o.get('siteId')=='s32' and o.get('requiresPassword') is False for o in kgm_lookup.get('options',[])),(code,kgm_lookup)
          code,kgm=call({'action':'login_site','name':'김건모','siteId':'s32'})
          assert code==200 and kgm.get('person',{}).get('access_role')=='worker',(code,kgm)
          print('OK: live worker login still valid')
