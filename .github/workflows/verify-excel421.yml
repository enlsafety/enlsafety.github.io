name: Verify Excel 421
on:
  push:
    paths:
      - '.github/workflows/verify-excel421.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check incident-excel-v421.js
      - name: Build sample workbook
        run: |
          node <<'JS'
          const fs=require('fs');
          global.window={};
          global.data={incidents:[]};
          global.currentUser=()=>({id:'safe1',name:'안전관리자',role:'safety',siteId:'HQ'});
          global.siteById=id=>({name:'테스트사업장'});
          require('./incident-excel-v421.js');
          const png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
          const incident={id:'T1',status:'closed',category:'person',priority:'important',siteId:'S1',occurredAt:'2026-09-01T10:20:00+09:00',eventType:'베임',severity:'moderate',reporterName:'홍길동',createdAt:'2026-09-01T11:00:00+09:00',approvedBy:'박태영',approvedAt:'2026-09-01T14:00:00+09:00',closedAt:'2026-09-02T17:00:00+09:00',potentialMajor:false,summary:'사고 경위',immediateAction:'응급조치',leaveEstimate:'none',photos:[{kind:'image',name:'현장사진.png',dataUrl:png}],reportDetails:{place:'장비창고',workAction:'정비 작업',incidentHow:'정비 중 손가락 접촉',environmentCause:'작업대 협소',behaviorCause:'고정 미흡',injuredName:'김직원',job:'코스관리',injuryDetail:'검지 열상',diagnosis:'열상',doctorOpinion:'통원치료',medicalCost:42000,medicalCostDetail:'초진비',preventionPlan:'고정구 사용 및 교육',specialNote:'없음'},corrective:{status:'approved',rootCause:'절차 미준수',actionDetail:'작업대 개선 및 교육',ownerName:'현장소장',dueDate:'2026-09-02',submittedBy:'현장소장',submittedAt:'2026-09-02T14:00:00+09:00',reviewedBy:'박태영',reviewedAt:'2026-09-02T16:00:00+09:00',reviewNote:'조치 완료',afterPhotos:[{kind:'image',name:'조치후.png',dataUrl:png}]}};
          window.enlBuildFinalIncidentWorkbook(incident).then(bytes=>{if(!bytes||bytes.length<10000)throw new Error('workbook too small');fs.writeFileSync('/tmp/excel421.xlsx',Buffer.from(bytes));console.log('xlsx bytes',bytes.length,'version',window.ENL_INCIDENT_EXCEL_VERSION)}).catch(e=>{console.error(e);process.exit(1)});
          JS
          unzip -t /tmp/excel421.xlsx
      - name: Validate workbook XML and sheet order
        run: |
          python - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          p='/tmp/excel421.xlsx'
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.endswith('.xml'):
                      ET.fromstring(z.read(n))
              root=ET.fromstring(z.read('xl/workbook.xml'))
              ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
              names=[s.attrib['name'] for s in root.find('m:sheets',ns)]
              assert names==['사고경위서','자료첨부시트1','자료첨부시트2','사고조치보고서'], names
              drawing=ET.fromstring(z.read('xl/drawings/drawing1.xml'))
              assert drawing.tag=='{http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing}wsDr', drawing.tag
          print('Excel 421 verification OK')
          PY
