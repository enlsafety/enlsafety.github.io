name: global update smoke

on:
  workflow_dispatch:

jobs:
  global-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app-control-v410.js
          node --check incident-sync-v411.js
      - name: Public controls and incident write guards
        run: |
          node tests/sync-races.cjs
          node tests/final-cache.cjs
      - name: Global control API security
        shell: python
        run: |
          import json,urllib.request,urllib.error
          URL='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-global-refresh'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          req=urllib.request.Request(URL,headers=H,method='GET')
          with urllib.request.urlopen(req,timeout=20) as r:
            body=json.loads(r.read().decode())
            assert r.status==200 and body.get('ok') is True and int(body.get('epoch',0))>=1,body
          bad={'action':'global-refresh','actor':{'id':'u-final-manager','name':'관리자','role':'manager'},'passwordHash':'x','version':'test'}
          req=urllib.request.Request(URL,data=json.dumps(bad).encode(),headers=H,method='POST')
          try:
            urllib.request.urlopen(req,timeout=20)
            raise AssertionError('manager unexpectedly allowed')
          except urllib.error.HTTPError as e:
            assert e.code==403,e.code
          print('OK: global update GET works and non-safety POST is forbidden')
