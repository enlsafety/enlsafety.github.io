name: Home density browser checks
on:
  push:
    branches: [qa/home-density-r146]
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: node tests/newsroom-browser.cjs
        env:
          PW_CHANNEL: chrome
