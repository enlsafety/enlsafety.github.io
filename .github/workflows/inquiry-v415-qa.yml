name: inquiry v415 integration QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inquiry-v415-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Worker inquiry to safety inbox lifecycle
        shell: python
        run: |
          import json,urllib.request,urllib.error
          BASE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(fn,body):
            req=urllib.request.Request(BASE+fn,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.loads(r.read().decode())
            except urllib.error.HTTPError as e:
              raw=e.read().decode()
              try:p=json.loads(raw)
              except:p={'raw':raw}
              return e.code,p

          code,login=call('enl-login-v411',{'action':'login_site','name':'김건모','siteId':'s32'})
          assert code==200 and login.get('person',{}).get('access_role')=='worker',(code,login)
          pid=login['person']['personnel_id']
          worker={'id':pid,'name':'김건모','role':'worker','position':'일반근로자','siteId':'s32'}
          safety={'id':'u-safety-demo','name':'박태영','role':'safety','position':'','siteId':''}

          code,plist=call('enl-login-v411',{'action':'personnel_pull','actor':safety,'siteId':'s32'})
          assert code==200 and plist.get('ok') is True,(code,plist)
          people=plist.get('personnel',[])
          assert any(p.get('access_role')=='worker' for p in people),people
          assert all('phone' in p for p in people),people

          subject='[QA-V415] 근로자 문의 연결 테스트'
          code,created=call('enl-workflow-v412',{'action':'inquiry_create','actor':worker,'category':'안전 관련 문의','subject':subject,'body':'일반근로자 문의 서버 연결 자동검증용 임시 데이터입니다.'})
          assert code==200 and created.get('ok') is True,(code,created)
          q=created['inquiry']; qid=q['inquiry_id']
          assert q.get('category')=='안전 관련 문의' and q.get('sender_role')=='worker',q
          print('QA_INQUIRY_ID='+qid)

          code,slist=call('enl-workflow-v412',{'action':'inquiry_safety_list','actor':safety,'status':'new'})
          assert code==200 and any(x.get('inquiry_id')==qid for x in slist.get('inquiries',[])),(code,slist)

          code,read=call('enl-workflow-v412',{'action':'inquiry_read','actor':safety,'inquiryId':qid})
          assert code==200 and read.get('inquiry',{}).get('status')=='read',(code,read)
          code,reply=call('enl-workflow-v412',{'action':'inquiry_reply','actor':safety,'inquiryId':qid,'body':'자동검증 답변입니다.'})
          assert code==200 and reply.get('inquiry',{}).get('status')=='answered',(code,reply)

          code,mine=call('enl-workflow-v412',{'action':'inquiry_my_list','actor':worker})
          found=next((x for x in mine.get('inquiries',[]) if x.get('inquiry_id')==qid),None)
          assert code==200 and found and found.get('answer_body')=='자동검증 답변입니다.',(code,mine)

          code,deleted=call('enl-workflow-v412',{'action':'inquiry_delete','actor':safety,'inquiryId':qid})
          assert code==200 and deleted.get('inquiry',{}).get('deleted_at'),(code,deleted)
          code,trash=call('enl-workflow-v412',{'action':'inquiry_safety_list','actor':safety,'deleted':True})
          assert code==200 and any(x.get('inquiry_id')==qid for x in trash.get('inquiries',[])),(code,trash)

          code,restored=call('enl-workflow-v412',{'action':'inquiry_restore','actor':safety,'inquiryId':qid})
          assert code==200 and restored.get('inquiry',{}).get('deleted_at') is None,(code,restored)
          code,deleted2=call('enl-workflow-v412',{'action':'inquiry_delete','actor':safety,'inquiryId':qid})
          assert code==200 and deleted2.get('inquiry',{}).get('deleted_at'),(code,deleted2)
          print('OK: worker inquiry creation, safety visibility/read/reply, soft delete and restore all work')
