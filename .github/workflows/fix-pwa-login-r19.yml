name: Fix iPhone PWA login r19
on:
  push:
    paths:
      - '.github/workflows/fix-pwa-login-r19.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inquiry request storm and PWA login timeout
        shell: python
        run: |
          from pathlib import Path
          import json, re

          # 1) Stop safety inquiry badge MutationObserver from flooding the workflow API.
          p=Path('workflow-v412.js')
          s=p.read_text(encoding='utf-8')
          old="""  let activeIncidentId='';
  let inquiryBusy=false;
  let inquiryNavActive=false;
"""
          new="""  let activeIncidentId='';
  let inquiryBusy=false;
  let inquiryNavActive=false;
  let inquiryCountBusy=false;
  let inquiryCountLastAt=0;
  let inquiryCountLastValue=null;
"""
          if old not in s: raise SystemExit('workflow declarations not found')
          s=s.replace(old,new,1)
          pat=re.compile(r"  async function markInquiryButton\(\)\{.*?\n  \}\n\n  const observer=",re.S)
          repl="""  async function markInquiryButton(force=false){
    const u=currentUser?.();if(roleNorm(u?.role)!=='safety')return;
    const b=document.querySelector('[data-wf-inquiry-nav]');if(!b)return;
    const now=Date.now();
    const paint=n=>{const html=`문의함${n>0?` <span class=\"wf412-nav-badge\">${n>99?'99+':n}</span>`:''}`;if(b.innerHTML!==html)b.innerHTML=html};
    if(inquiryCountBusy)return;
    if(!force&&now-inquiryCountLastAt<15000){if(inquiryCountLastValue!==null)paint(inquiryCountLastValue);return}
    inquiryCountBusy=true;
    try{const r=await api({action:'inquiry_count',actor:actor(u)},8000),n=Number(r.count||0);inquiryCountLastAt=Date.now();inquiryCountLastValue=n;paint(n)}
    catch(e){inquiryCountLastAt=Date.now()}
    finally{inquiryCountBusy=false}
  }

  const observer="""
          s,n=pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit(f'markInquiryButton replacement count={n}')
          s=s.replace("const VERSION='4.1.6-inquiry2'","const VERSION='4.1.6-inquiry3-throttle1'",1)
          p.write_text(s,encoding='utf-8')

          # 2) Allow PWA login lookup to survive short backend/mobile network stalls.
          p=Path('auth-v411.js')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='4.1.1-r11'" not in s or 'async function api(body,timeout=10000)' not in s:
              raise SystemExit('auth expected version/timeout not found')
          s=s.replace("const VERSION='4.1.1-r11'","const VERSION='4.1.1-r19-pwa-login1'",1)
          s=s.replace('async function api(body,timeout=10000)','async function api(body,timeout=18000)',1)
          p.write_text(s,encoding='utf-8')

          # 3) Force installed PWA/service worker to refresh to the fixed shell.
          p=Path('pwa-push-v418.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='4.1.8-pwa-push1'","const VERSION='4.1.8-pwa-push2'",1)
          s=s.replace("const SW_URL='/sw-v418.js?v=4.1.8-pwa1'","const SW_URL='/sw-v418.js?v=4.1.8-pwa2'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw-v418.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const ENL_SW_VERSION='4.1.8-pwa1'","const ENL_SW_VERSION='4.1.8-pwa2'",1)
          s=s.replace("const CACHE_NAME='enl-pwa-418-r18'","const CACHE_NAME='enl-pwa-418-r19'",1)
          p.write_text(s,encoding='utf-8')

          # 4) Publish r19 and cache-bust only the changed runtime files.
          p=Path('stable412.html')
          s=p.read_text(encoding='utf-8')
          if '4.1.2-r18' not in s: raise SystemExit('stable r18 marker missing')
          s=s.replace('4.1.2-r18','4.1.2-r19')
          s=s.replace('auth-v411.js?v=4.1.2-r16','auth-v411.js?v=4.1.2-r19&amp;fix=pwa-login1',1)
          s=s.replace('workflow-v412.js?v=4.1.2-r16&amp;fix=inquiry2','workflow-v412.js?v=4.1.2-r19&amp;fix=inquiry-throttle1',1)
          s=s.replace('pwa-push-v418.js?v=4.1.2-r19&amp;fix=pwa-push1','pwa-push-v418.js?v=4.1.2-r19&amp;fix=pwa-push2',1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('build=r18','build=r19')
          p.write_text(s,encoding='utf-8')

          p=Path('version.json')
          meta=json.loads(p.read_text(encoding='utf-8'))
          meta['build']='stable-412-r19'
          meta['updatedAt']='2026-09-03T11:55:00+09:00'
          p.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 5) Keep production smoke aligned with r19 and assert the storm guard.
          p=Path('.github/workflows/v410-smoke.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Production r18 PWA and unified workflow rules','Production r19 PWA and unified workflow rules')
          s=s.replace('stable-412-r18','stable-412-r19')
          s=s.replace('build=r18','build=r19')
          s=s.replace('4.1.2-r18','4.1.2-r19')
          s=s.replace('workflow-v412.js?v=4.1.2-r16&amp;fix=inquiry2','workflow-v412.js?v=4.1.2-r19&amp;fix=inquiry-throttle1')
          s=s.replace('pwa-push-v418.js?v=4.1.2-r19&amp;fix=pwa-push1','pwa-push-v418.js?v=4.1.2-r19&amp;fix=pwa-push2')
          s=s.replace("'시험 알림'","'테스트 알림'")
          s=s.replace('stable r18, PWA push','stable r19, PWA push')
          anchor="""          workflow=Path('workflow-v412.js').read_text(encoding='utf-8')
          for x in ['문의 구분','inquiry_create','inquiry_delete','inquiry_restore','inquiry_purge','data-wf-inq-purge','setInquiryNavActive','worker','임시삭제','완전삭제','최종수정자']: assert x in workflow,x
"""
          add=anchor+"""          for x in ['inquiryCountBusy','inquiryCountLastAt','inquiryCountLastValue','now-inquiryCountLastAt<15000','if(b.innerHTML!==html)b.innerHTML=html']: assert x in workflow,x
          auth=Path('auth-v411.js').read_text(encoding='utf-8')
          assert "async function api(body,timeout=18000)" in auth, 'PWA login timeout guard missing'
"""
          if anchor not in s: raise SystemExit('smoke workflow anchor missing')
          s=s.replace(anchor,add,1)
          # Add changed auth/runtime references to stable assertions.
          ref_anchor="""            'session-refresh-v412.js?v=4.1.2-r16&amp;fix=session2',
"""
          if ref_anchor not in s: raise SystemExit('smoke ref anchor missing')
          s=s.replace(ref_anchor,ref_anchor+"            'auth-v411.js?v=4.1.2-r19&amp;fix=pwa-login1',\n",1)
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/fix-pwa-login-r19.yml').unlink()
      - name: Validate patched runtime
        shell: bash
        run: |
          node --check workflow-v412.js
          node --check auth-v411.js
          node --check pwa-push-v418.js
          node --check sw-v418.js
          python3 -m json.tool version.json >/dev/null
          grep -q 'stable-412-r19' version.json
          grep -q 'inquiryCountBusy' workflow-v412.js
          grep -q 'timeout=18000' auth-v411.js
          grep -q 'enl-pwa-418-r19' sw-v418.js
          grep -q 'workflow-v412.js?v=4.1.2-r19&amp;fix=inquiry-throttle1' stable412.html
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix iPhone PWA login and inquiry count request storm'
          git push
