name: Fix iPhone PWA login r19
on:
  push:
    paths:
      - '.github/workflows/fix-pwa-login-r19.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inquiry request storm and PWA login timeout
        shell: python
        run: |
          from pathlib import Path
          import json, re

          p=Path('workflow-v412.js')
          s=p.read_text(encoding='utf-8')
          old="  let activeIncidentId='';\n  let inquiryBusy=false;\n  let inquiryNavActive=false;\n"
          new="  let activeIncidentId='';\n  let inquiryBusy=false;\n  let inquiryNavActive=false;\n  let inquiryCountBusy=false;\n  let inquiryCountLastAt=0;\n  let inquiryCountLastValue=null;\n"
          if old not in s: raise SystemExit('workflow declarations not found')
          s=s.replace(old,new,1)
          pat=re.compile(r"  async function markInquiryButton\(\)\{.*?\n  \}\n\n  const observer=",re.S)
          repl=("  async function markInquiryButton(force=false){\n"
                "    const u=currentUser?.();if(roleNorm(u?.role)!=='safety')return;\n"
                "    const b=document.querySelector('[data-wf-inquiry-nav]');if(!b)return;\n"
                "    const now=Date.now();\n"
                "    const paint=n=>{const html=`문의함${n>0?` <span class=\\\"wf412-nav-badge\\\">${n>99?'99+':n}</span>`:''}`;if(b.innerHTML!==html)b.innerHTML=html};\n"
                "    if(inquiryCountBusy)return;\n"
                "    if(!force&&now-inquiryCountLastAt<15000){if(inquiryCountLastValue!==null)paint(inquiryCountLastValue);return}\n"
                "    inquiryCountBusy=true;\n"
                "    try{const r=await api({action:'inquiry_count',actor:actor(u)},8000),n=Number(r.count||0);inquiryCountLastAt=Date.now();inquiryCountLastValue=n;paint(n)}\n"
                "    catch(e){inquiryCountLastAt=Date.now()}\n"
                "    finally{inquiryCountBusy=false}\n"
                "  }\n\n"
                "  const observer=")
          s,n=pat.subn(lambda m: repl,s,count=1)
          if n!=1: raise SystemExit(f'markInquiryButton replacement count={n}')
          s=s.replace("const VERSION='4.1.6-inquiry2'","const VERSION='4.1.6-inquiry3-throttle1'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('auth-v411.js')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='4.1.1-r11'" not in s or 'async function api(body,timeout=10000)' not in s: raise SystemExit('auth markers missing')
          s=s.replace("const VERSION='4.1.1-r11'","const VERSION='4.1.1-r19-pwa-login1'",1)
          s=s.replace('async function api(body,timeout=10000)','async function api(body,timeout=18000)',1)
          p.write_text(s,encoding='utf-8')

          p=Path('pwa-push-v418.js')
          s=p.read_text(encoding='utf-8')
          if "4.1.8-pwa-push1" not in s or "4.1.8-pwa1" not in s: raise SystemExit('pwa markers missing')
          s=s.replace("const VERSION='4.1.8-pwa-push1'","const VERSION='4.1.8-pwa-push2'",1)
          s=s.replace("const SW_URL='/sw-v418.js?v=4.1.8-pwa1'","const SW_URL='/sw-v418.js?v=4.1.8-pwa2'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw-v418.js')
          s=p.read_text(encoding='utf-8')
          if "enl-pwa-418-r18" not in s: raise SystemExit('sw marker missing')
          s=s.replace("const ENL_SW_VERSION='4.1.8-pwa1'","const ENL_SW_VERSION='4.1.8-pwa2'",1)
          s=s.replace("const CACHE_NAME='enl-pwa-418-r18'","const CACHE_NAME='enl-pwa-418-r19'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('stable412.html')
          s=p.read_text(encoding='utf-8')
          if '4.1.2-r18' not in s: raise SystemExit('stable marker missing')
          s=s.replace('4.1.2-r18','4.1.2-r19')
          s=s.replace('auth-v411.js?v=4.1.2-r16','auth-v411.js?v=4.1.2-r19&amp;fix=pwa-login1',1)
          s=s.replace('workflow-v412.js?v=4.1.2-r16&amp;fix=inquiry2','workflow-v412.js?v=4.1.2-r19&amp;fix=inquiry-throttle1',1)
          s=s.replace('pwa-push-v418.js?v=4.1.2-r19&amp;fix=pwa-push1','pwa-push-v418.js?v=4.1.2-r19&amp;fix=pwa-push2',1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'build=r18' not in s: raise SystemExit('index marker missing')
          p.write_text(s.replace('build=r18','build=r19'),encoding='utf-8')

          p=Path('version.json')
          meta=json.loads(p.read_text(encoding='utf-8'))
          meta['build']='stable-412-r19'
          meta['updatedAt']='2026-09-03T11:59:00+09:00'
          p.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Validate patched runtime
        shell: bash
        run: |
          node --check workflow-v412.js
          node --check auth-v411.js
          node --check pwa-push-v418.js
          node --check sw-v418.js
          python3 -m json.tool version.json >/dev/null
          grep -q 'stable-412-r19' version.json
          grep -q 'inquiryCountBusy' workflow-v412.js
          grep -q 'now-inquiryCountLastAt<15000' workflow-v412.js
          grep -q 'timeout=18000' auth-v411.js
          grep -q 'enl-pwa-418-r19' sw-v418.js
          grep -q 'workflow-v412.js?v=4.1.2-r19&amp;fix=inquiry-throttle1' stable412.html
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-v412.js auth-v411.js pwa-push-v418.js sw-v418.js stable412.html index.html version.json
          git commit -m 'Fix iPhone PWA login and inquiry count request storm'
          git push
