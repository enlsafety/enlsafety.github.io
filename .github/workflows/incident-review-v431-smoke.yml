name: incident review v431 smoke

on:
  workflow_dispatch:

jobs:
  review-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check incident-review-v431.js
          node --check production-cleanup-v431.js
      - name: Review preview and cleanup wiring
        shell: python
        run: |
          from pathlib import Path
          review=Path('incident-review-v431.js').read_text(encoding='utf-8')
          cleanup=Path('production-cleanup-v431.js').read_text(encoding='utf-8')
          html=Path('stable412.html').read_text(encoding='utf-8')
          required=[
            'border-top:1px solid #d8ebf7',
          ]
          for x in required: assert x in review,x
          assert 'signAttachments(' not in review, 'core is the only attachment hydration owner'
          assert 'window.enlBindAttachmentOpen=' not in review, 'review must not wrap the gallery binder'
          for x in ['u-field-demo','u-safety-demo','u-final-demo','enl_accident_demo_v1','테스트 경영진','테스트 관리자','테스트 안전관리자']:
            assert x in cleanup,x
          assert 'incident-review-v431.js?v=4.8.4-r1' in html
          assert 'production-cleanup-v431.js?v=4.4.38-r1&amp;fix=test-hq-cleanup1' in html
          assert html.index('workflow-prevention-v429.js') < html.index('incident-review-v431.js') < html.index('production-cleanup-v431.js')
          print('OK: attachment preview rendering has one owner, detail rows are separated, legacy local demo records are purged')
