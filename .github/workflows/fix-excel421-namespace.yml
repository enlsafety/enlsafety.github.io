name: Fix Excel 421 drawing namespace
on:
  push:
    paths:
      - '.github/workflows/fix-excel421-namespace.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix spreadsheet drawing namespace
        run: |
          sed -i 's#http://schemas.openxmlformats.org/spreadsheetDrawing#http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing#g' incident-excel-v421.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add incident-excel-v421.js
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Excel attachment drawing namespace'
            git push
          fi
