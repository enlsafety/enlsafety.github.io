name: final isolated cloud QA
on:
  push:
    branches: [qa/ui-pastel-4813]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Map selection, addresses, touch, zoom and role visibility
        run: node tests/dashboard-browser.cjs
      - name: Verify complete themed screens, documents and field input
        run: node tests/pastel-ui-browser.cjs
