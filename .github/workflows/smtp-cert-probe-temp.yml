name: smtp cert probe temp
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smtp-cert-probe-temp.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS
        run: |
          getent hosts mail.enlife.co.kr || true
      - name: SMTP 465 certificate
        run: |
          set +e
          timeout 12 openssl s_client -connect mail.enlife.co.kr:465 -servername mail.enlife.co.kr -showcerts </dev/null 2>&1 | tee /tmp/s465.txt
          echo "=== VERIFY SUMMARY ==="
          grep -E "subject=|issuer=|Verify return code|Certificate chain|Server certificate" /tmp/s465.txt || true
      - name: SMTP 587 STARTTLS certificate
        run: |
          set +e
          timeout 12 openssl s_client -starttls smtp -connect mail.enlife.co.kr:587 -servername mail.enlife.co.kr -showcerts </dev/null 2>&1 | tee /tmp/s587.txt
          echo "=== VERIFY SUMMARY ==="
          grep -E "subject=|issuer=|Verify return code|Certificate chain|Server certificate" /tmp/s587.txt || true
