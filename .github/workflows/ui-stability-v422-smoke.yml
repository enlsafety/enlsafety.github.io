name: ui stability smoke

on:
  push:
    branches: [main]
    paths:
      - 'ui-stability-v422.js'
      - 'reader-ack-ux-v423.js'
      - 'stable412.html'
      - '.github/workflows/ui-stability-v422-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: UI stability syntax
        run: |
          node --check ui-stability-v422.js
          node --check reader-ack-ux-v423.js
      - name: UI stability wiring
        shell: python
        run: |
          from pathlib import Path
          js=Path('ui-stability-v422.js').read_text(encoding='utf-8')
          ack=Path('reader-ack-ux-v423.js').read_text(encoding='utf-8')
          html=Path('stable412.html').read_text(encoding='utf-8')
          for x in [
            "4.2.2-ui-stability2",
            "window.renderShell=function(u)",
            "if(modalBusy()||transientViewBusy())return root",
            "window.openUserModal=function(user,u)",
            "비밀번호를 바꾸지 않고 이름·소속·직급·권한만 수정",
            "if(passwordHash)payload.passwordHash=passwordHash",
            "#enlPwaTop418.on::after"
          ]: assert x in js,x
          for x in [
            "4.2.3-reader-ack1",
            "이 종결사고는 열람 확인이 필요합니다",
            "이 종결사고 열람 확인하기",
            "열람확인 필요",
            "data-lifecycle-final",
            "#ackIncident411"
          ]: assert x in ack,x
          assert 'ui-stability-v422.js?v=4.1.2-r21&amp;fix=pc-hq1' in html
          assert 'reader-ack-ux-v423.js?v=4.1.2-r21&amp;fix=closed-ack1' in html
          assert html.rfind('reader-ack-ux-v423.js') > html.rfind('ui-stability-v422.js')
          print('OK: stable shell, HQ editor and prominent finalized read acknowledgement wiring')
