name: ui stability smoke

on:
  push:
    branches: [main]
    paths:
      - 'ui-stability-v422.js'
      - 'reader-ack-ux-v423.js'
      - 'reader-experience-v424.js'
      - 'push-session-v425.js'
      - 'sw-v418.js'
      - 'stable412.html'
      - '.github/workflows/ui-stability-v422-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: UI syntax
        run: |
          node --check ui-stability-v422.js
          node --check reader-ack-ux-v423.js
          node --check reader-experience-v424.js
          node --check push-session-v425.js
          node --check sw-v418.js
      - name: UI stability and push wiring
        shell: python
        run: |
          from pathlib import Path
          stable=Path('ui-stability-v422.js').read_text(encoding='utf-8')
          ack=Path('reader-ack-ux-v423.js').read_text(encoding='utf-8')
          rx=Path('reader-experience-v424.js').read_text(encoding='utf-8')
          ps=Path('push-session-v425.js').read_text(encoding='utf-8')
          sw=Path('sw-v418.js').read_text(encoding='utf-8')
          html=Path('stable412.html').read_text(encoding='utf-8')
          for x in ["4.2.2-ui-stability2","window.renderShell=function(u)","if(modalBusy()||transientViewBusy())return root"]: assert x in stable,x
          for x in ["4.2.3-reader-ack1","이 종결사고는 열람 확인이 필요합니다","열람확인 필요"]: assert x in ack,x
          for x in ["4.2.4-reader-experience1","enl-comment-delete-v424","enl424-nav-dot","내 의견 삭제","normalizeNavActive"]: assert x in rx,x
          for x in [
            "4.2.5-push-session2",
            "enl-push-claim-v425",
            "PENDING_KEY='enl_pending_push_incident_v425'",
            "claimForCurrentUser",
            "openPendingIncident",
            "primeWorkflowIncident",
            "안전관리자 검토대기 단계"
          ]: assert x in ps,x
          for x in ["4.2.5-pwa3","incidentId","stable412.html?push=1&incident="]: assert x in sw,x
          assert 'push-session-v425.js?v=4.1.2-r22&amp;fix=ownership-deeplink1' in html
          assert html.rfind('push-session-v425.js') > html.rfind('reader-experience-v424.js')
          print('OK: stable UI, device ownership claim, and push incident deep-link wiring')
      - name: Live endpoint guards
        shell: python
        run: |
          import json,urllib.request,urllib.error
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(url,body):
            req=urllib.request.Request(url,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.loads(r.read().decode())
            except urllib.error.HTTPError as e:
              try:p=json.loads(e.read().decode())
              except:p={}
              return e.code,p
          code,j=call('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-comment-delete-v424',{'action':'health'})
          assert code==200 and j.get('ok') is True and j.get('version')=='4.2.4-comment-delete1',(code,j)
          code,j=call('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-push-claim-v425',{'action':'health'})
          assert code==200 and j.get('ok') is True and j.get('version')=='4.2.5-push-claim1',(code,j)
          code,j=call('https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/enl-push-claim-v425',{'action':'claim','actor':{'id':'missing','role':'manager'},'subscription':{'endpoint':'x','keys':{'p256dh':'y','auth':'z'}}})
          assert code==403 and j.get('message')=='forbidden',(code,j)
          print('OK: comment delete and push ownership endpoints are live with server-side guards')
