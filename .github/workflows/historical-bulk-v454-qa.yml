name: historical importer retirement QA
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  retired-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save --package-lock=false @electric-sql/pglite@0.3.10
          node --check workflow-prevention-v429.js
          node tests/past-report-policy.cjs
