name: historical importer retirement QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'stable412.html'
      - 'sw-v418.js'
      - 'edge-functions/enl-historical-bulk-v454/**'
      - 'tests/manual-historical-v2-policy.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check historical-transfer-v449.js
          node --check workflow-prevention-v429.js
          node tests/manual-historical-v2-policy.cjs
