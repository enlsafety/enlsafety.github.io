name: manual historical transfer v456 QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'historical-transfer-v449.js'
      - 'workflow-prevention-v429.js'
      - 'workflow-lifecycle-v413.js'
      - 'edge-functions/enl-incident-sync-v411/**'
      - 'edge-functions/enl-historical-bulk-v454/**'
      - 'edge-functions/enl-push-v418/**'
      - 'edge-functions/enl-email-v441/**'
      - 'stable412.html'
      - 'sw-v418.js'
      - 'tests/manual-historical-v456*'
      - '.github/workflows/historical-bulk-v454-qa.yml'
  push:
    branches: [main]
    paths:
      - 'historical-transfer-v449.js'
      - 'workflow-prevention-v429.js'
      - 'workflow-lifecycle-v413.js'
      - 'edge-functions/enl-incident-sync-v411/**'
      - 'edge-functions/enl-historical-bulk-v454/**'
      - 'edge-functions/enl-push-v418/**'
      - 'edge-functions/enl-email-v441/**'
      - 'stable412.html'
      - 'sw-v418.js'
      - 'tests/manual-historical-v456*'
      - '.github/workflows/historical-bulk-v454-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual-transfer-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax, automatic import retirement and lifecycle invariants
        run: |
          node --check historical-transfer-v449.js
          node --check workflow-prevention-v429.js
          node --check workflow-lifecycle-v413.js
          node --check reader-ui-v414.js
          node --check management-approval-v448.js
          node --check incident-excel-v421.js
          node tests/manual-historical-v456-core.cjs
      - name: Install isolated browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium webkit
      - name: Chromium and iPhone WebKit manual historical flow
        run: node tests/manual-historical-v456-browser.cjs
