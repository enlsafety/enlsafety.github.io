name: historical importer retirement QA
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  retired-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check historical-transfer-v449.js
          node --check workflow-prevention-v429.js
          node tests/manual-historical-v2-policy.cjs
