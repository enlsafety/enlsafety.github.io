name: One-time update production smoke for r18
on:
  push:
    paths:
      - '.github/workflows/fix-r18-smoke.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update smoke expectations and remove this helper
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/v410-smoke.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Production r17 and unified workflow rules','Production r18 PWA and unified workflow rules')
          s=s.replace("'stable-412-r17'","'stable-412-r18'")
          s=s.replace("'build=r17'","'build=r18'")
          s=s.replace('enl-build\" content=\"4.1.2-r17','enl-build\" content=\"4.1.2-r18')
          s=s.replace("report-v410.js; do","report-v410.js pwa-push-v418.js sw-v418.js; do")
          s=s.replace("assert p.scripts[-1]=='workflow-v412.js?v=4.1.2-r16&fix=inquiry2',p.scripts[-1]","assert p.scripts[-1]=='pwa-push-v418.js?v=4.1.2-r18&fix=pwa-push1',p.scripts[-1]")
          s=s.replace("html.index('incident-excel-v421.js') < html.index('workflow-v412.js')","html.index('incident-excel-v421.js') < html.index('workflow-v412.js') < html.index('pwa-push-v418.js')")
          s=s.replace("print('OK: stable r17, Excel 2019 report/attachment export and lifecycle wired')","assert 'manifest.webmanifest?v=4.1.2-r18' in html\n          assert 'pwa-icon-180.png?v=4.1.2-r18' in html\n          push=Path('pwa-push-v418.js').read_text(encoding='utf-8')\n          for x in ['beforeinstallprompt','Notification.requestPermission','pushManager.subscribe','시험 알림','알림 설정']: assert x in push,x\n          sw=Path('sw-v418.js').read_text(encoding='utf-8')\n          for x in [\"addEventListener('push'\",\"showNotification\",\"notificationclick\"]: assert x in sw,x\n          print('OK: stable r18, PWA push, Excel 2019 report/attachment export and lifecycle wired')")
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-r18-smoke.yml').unlink()
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update production smoke for r18 PWA push'
          git push
