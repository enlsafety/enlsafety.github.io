name: Site safety cards
on:
  push:
    branches: [qa/safety-cards-r159]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.51.1-noble
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        suite: [safety-card-api,safety-card-browser,sidebar-menu-order-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 @electric-sql/pglite@0.3.10
      - run: node tests/${{ matrix.suite }}.cjs
      - run: node tests/final-cache.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-cards-${{ matrix.suite }}
          path: qa-output
          if-no-files-found: ignore
