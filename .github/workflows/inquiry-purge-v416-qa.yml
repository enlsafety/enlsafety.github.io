name: inquiry purge v416 QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inquiry-purge-v416-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify inquiry purge lifecycle
        shell: python
        run: |
          import json,urllib.request,urllib.error
          BASE='https://wjelumpbjklfrdjxbesj.supabase.co/functions/v1/'
          H={'Content-Type':'application/json','X-ENL-App':'incident-report-v2','Origin':'https://enlsafety.github.io'}
          def call(fn,body):
            req=urllib.request.Request(BASE+fn,data=json.dumps(body,ensure_ascii=False).encode(),headers=H,method='POST')
            try:
              with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.loads(r.read().decode())
            except urllib.error.HTTPError as e:
              raw=e.read().decode()
              try:p=json.loads(raw)
              except:p={'raw':raw}
              return e.code,p

          code,login=call('enl-login-v411',{'action':'login_site','name':'김건모','siteId':'s32'})
          assert code==200 and login.get('person',{}).get('access_role')=='worker',(code,login)
          p=login['person']
          worker={'id':p['personnel_id'],'name':p['name'],'role':'worker','position':p.get('job_title') or '일반근로자','siteId':p['site_id']}
          safety={'id':'u-safety-demo','name':'박태영','role':'safety','position':'','siteId':''}
          subject='[QA-V416] 문의 완전삭제 테스트'

          code,created=call('enl-workflow-v412',{'action':'inquiry_create','actor':worker,'category':'앱 사용법','subject':subject,'body':'완전삭제 기능 자동검증용 임시 문의입니다.'})
          assert code==200 and created.get('ok') is True,(code,created)
          qid=created['inquiry']['inquiry_id']
          print('QA_INQUIRY_ID='+qid)

          code,blocked=call('enl-workflow-v412',{'action':'inquiry_purge','actor':safety,'inquiryId':qid})
          assert code==409 and blocked.get('message')=='not_deleted_inquiry',(code,blocked)

          code,soft=call('enl-workflow-v412',{'action':'inquiry_delete','actor':safety,'inquiryId':qid})
          assert code==200 and soft.get('inquiry',{}).get('deleted_at'),(code,soft)

          code,trash=call('enl-workflow-v412',{'action':'inquiry_safety_list','actor':safety,'deleted':True})
          assert code==200 and any(x.get('inquiry_id')==qid for x in trash.get('inquiries',[])),(code,trash)

          code,purged=call('enl-workflow-v412',{'action':'inquiry_purge','actor':safety,'inquiryId':qid})
          assert code==200 and purged.get('deleted') is True,(code,purged)

          code,trash2=call('enl-workflow-v412',{'action':'inquiry_safety_list','actor':safety,'deleted':True})
          assert code==200 and all(x.get('inquiry_id')!=qid for x in trash2.get('inquiries',[])),(code,trash2)
          code,mine=call('enl-workflow-v412',{'action':'inquiry_my_list','actor':worker})
          assert code==200 and all(x.get('inquiry_id')!=qid for x in mine.get('inquiries',[])),(code,mine)
          print('OK: direct purge blocked, soft delete then permanent purge removes inquiry completely')
