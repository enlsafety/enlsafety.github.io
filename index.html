  <meta name="enl-build" content="3.7.6" />
  <title>이앤엘 사고보고앱</title>
  <script>
    window.ENL_PAGE_BUILD='3.7.6';
    (function(){
      const current=window.ENL_PAGE_BUILD;
      const parts=v=>String(v||'0').split('.').map(x=>parseInt(x,10)||0);
      const newer=(a,b)=>{const aa=parts(a),bb=parts(b),n=Math.max(aa.length,bb.length);for(let i=0;i<n;i++){const av=aa[i]||0,bv=bb[i]||0;if(av>bv)return true;if(av<bv)return false}return false};
      const controller=typeof AbortController!=='undefined'?new AbortController():null;
      const timer=controller?setTimeout(()=>controller.abort(),2500):null;
      fetch(`version.json?boot=${Date.now()}&rnd=${Math.random().toString(36).slice(2)}`,{
        cache:'no-store',
        headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'},
        signal:controller?.signal
      }).then(r=>r.ok?r.json():null).then(j=>{
        const remote=String(j?.version||j?.build||'').trim();
        if(!remote||!newer(remote,current))return;
        const key='enl_bootstrap_refresh_'+remote;
        const last=Number(sessionStorage.getItem(key)||0);
        if(Date.now()-last<90000)return;
        sessionStorage.setItem(key,String(Date.now()));
        const u=new URL(location.href);
        u.searchParams.set('appv',remote);
        u.searchParams.set('_reload',String(Date.now()));
        u.searchParams.set('_fresh','1');
        u.searchParams.set('_cb',Math.random().toString(36).slice(2));
        location.replace(u.toString());
      }).catch(()=>{}).finally(()=>{if(timer)clearTimeout(timer)});
    })();
  </script>
