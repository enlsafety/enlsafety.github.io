<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이앤엘 PC 알림 진단</title>
<style>
body{font-family:"Malgun Gothic",Arial,sans-serif;background:#f3f8fc;color:#173b66;margin:0;padding:24px}.card{max-width:620px;margin:30px auto;background:#fff;border:1px solid #c9ddeb;border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(20,55,80,.08)}h1{font-size:24px;margin:0 0 10px}.desc{line-height:1.6;color:#526d81}.grid{display:grid;gap:9px;margin:20px 0}.row{display:flex;justify-content:space-between;gap:20px;padding:12px;border:1px solid #dbe7ef;border-radius:10px;background:#f9fcfe}.row b{color:#234f70}button{width:100%;min-height:54px;border:0;border-radius:12px;background:#1e5d91;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.msg{margin-top:15px;padding:12px;border-radius:10px;background:#edf6fc;line-height:1.55}.ok{background:#eaf7ef;color:#226b49}.err{background:#fff0f0;color:#9a3434}.small{font-size:12px;color:#6c8190;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>PC 알림 진단</h1>
  <div class="desc">서버 푸시를 사용하지 않고 이 PC의 Edge/Windows 알림 표시 기능만 직접 시험합니다.</div>
  <div class="grid">
    <div class="row"><span>알림 권한</span><b id="perm">확인 중</b></div>
    <div class="row"><span>Service Worker</span><b id="sw">확인 중</b></div>
    <div class="row"><span>보안 연결</span><b id="secure">확인 중</b></div>
  </div>
  <button id="test">PC 자체 알림 띄우기</button>
  <div id="msg" class="msg">버튼을 누른 뒤 화면 오른쪽 아래와 Win + N 알림센터를 확인하세요.</div>
  <div class="small">이 페이지에서 알림이 뜨면 Windows의 알림 표시 기능은 정상입니다. 뜨지 않으면 사고보고앱 서버가 아니라 Windows/Edge 알림 표시 문제로 판단할 수 있습니다.</div>
</div>
<script>
(function(){
  const perm=document.getElementById('perm'),sw=document.getElementById('sw'),secure=document.getElementById('secure'),msg=document.getElementById('msg'),btn=document.getElementById('test');
  const update=()=>{perm.textContent=('Notification'in window)?Notification.permission:'지원 안 됨';sw.textContent=('serviceWorker'in navigator)?'지원됨':'지원 안 됨';secure.textContent=window.isSecureContext?'정상(HTTPS)':'비보안';};
  update();
  btn.onclick=async()=>{
    btn.disabled=true;msg.className='msg';msg.textContent='PC 자체 알림을 준비하고 있습니다…';
    try{
      if(!('Notification'in window)||!('serviceWorker'in navigator))throw new Error('이 브라우저는 웹 알림을 지원하지 않습니다.');
      if(Notification.permission==='default')await Notification.requestPermission();
      if(Notification.permission!=='granted')throw new Error('Edge 사이트 알림 권한이 허용되어 있지 않습니다.');
      const reg=await navigator.serviceWorker.register('/sw-v418.js?v=4.1.8-pwa2',{scope:'/'});
      await navigator.serviceWorker.ready;
      await reg.showNotification('이앤엘 사고보고앱 - PC 자체 테스트',{body:'이 알림이 보이면 Windows 알림 표시 기능은 정상입니다.',icon:'/pwa-icon-192.png',badge:'/pwa-icon-192.png',tag:'enl-local-diagnostic-'+Date.now(),data:{url:'https://enlsafety.github.io/'}});
      msg.className='msg ok';msg.textContent='알림 표시 요청을 PC에 전달했습니다. 오른쪽 아래 또는 Win + N 알림센터를 확인하세요.';
    }catch(e){msg.className='msg err';msg.textContent='실패: '+(e&&e.message?e.message:String(e));}
    finally{btn.disabled=false;update();}
  };
})();
</script>
</body>
</html>
